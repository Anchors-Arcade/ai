<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenRouter Chat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header>
      <h1>OpenRouter Chat</h1>
      <div class="header-actions">
        <button id="keyToggle" class="ghost" type="button">API key</button>
        <button id="newChat" class="ghost" type="button">New chat</button>
      </div>
    </header>

    <section id="keyPanel" class="panel" hidden>
      <label for="keyInput">OpenRouter API key</label>
      <div class="row">
        <input id="keyInput" type="password" placeholder="sk-or-..." autocomplete="off" spellcheck="false">
        <button id="keySave" type="button">Save key</button>
        <button id="keyClear" class="ghost" type="button">Remove</button>
      </div>
      <p class="hint">Stored only in this browser (localStorage) and sent only to openrouter.ai. Get a key at openrouter.ai/keys.</p>
    </section>

    <section class="model-bar">
      <label for="modelSearch">Model</label>
      <div class="combo">
        <input id="modelSearch" type="text" placeholder="Loading models..." autocomplete="off" spellcheck="false" role="combobox" aria-expanded="false" aria-controls="modelList">
        <ul id="modelList" role="listbox" hidden></ul>
      </div>
    </section>

    <main id="messages" aria-live="polite">
      <div id="empty" class="empty">Pick a model and send a message to start.</div>
    </main>

    <div id="error" class="error" role="alert" hidden></div>

    <form id="composer">
      <textarea id="input" rows="1" placeholder="Message the model..." aria-label="Message"></textarea>
      <button id="send" type="submit">Send</button>
    </form>
  </div>
  <script src="app.js"></script>
</body>
</html>
